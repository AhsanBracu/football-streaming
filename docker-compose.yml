# Part 2: HDFS. Part 3: Kafka + Kafka UI. Part 4: producer. Part 5: Spark. Part 6: MongoDB. Part 7 adds the dashboard here.
#
#   docker compose up -d        # start
#   docker compose ps           # check status
#   docker compose down         # stop and remove (data on volumes is kept; "down -v" deletes it)

# Settings shared by both HDFS containers. The apache/hadoop image turns
# variables like "CORE-SITE.XML_fs.defaultFS" into Hadoop's XML config files.
x-hadoop-env: &hadoop-env
  CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020          # address of HDFS
  HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:8020
  HDFS-SITE.XML_dfs.replication: "1"                        # only one DataNode, so keep one copy
  HDFS-SITE.XML_dfs.webhdfs.enabled: "true"                 # HTTP access (the producer uses this later)
  # Where HDFS keeps its files: on Docker volumes mounted at /data (below), so
  # they survive when a container is recreated. The image makes /data writable at startup.
  HDFS-SITE.XML_dfs.namenode.name.dir: /data/dfs/name       # the index (namenode)
  HDFS-SITE.XML_dfs.datanode.data.dir: /data/dfs/data       # the blocks (datanode)
  # Memory caps: Docker Desktop only has ~4 GB for all containers, and each Java
  # program would otherwise take as much as it likes (Kafka got OOM-killed).
  HADOOP_HEAPSIZE_MAX: 256m

services:
  # NameNode: the "index" of HDFS. It knows which files exist and where their blocks are.
  namenode:
    image: apache/hadoop:3.3.6
    platform: linux/amd64   # image is Intel-only; runs via emulation on Apple chips
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      <<: *hadoop-env
      # Format HDFS only if this folder doesn't exist yet (first start on an empty volume).
      ENSURE_NAMENODE_DIR: /data/dfs/name
    ports:
      - "9870:9870"   # web UI: http://localhost:9870
    volumes:
      - hdfs-name:/data       # the HDFS index survives a recreate
      # your laptop's data/ folder, visible inside the container as /input (read-only).
      # Not /data: the hadoop image chmods /data on startup, which fails on a read-only mount.
      - ./data:/input:ro

  # DataNode: stores the actual file contents (blocks).
  datanode:
    image: apache/hadoop:3.3.6
    platform: linux/amd64   # image is Intel-only; runs via emulation on Apple chips
    hostname: datanode
    command: ["hdfs", "datanode"]
    environment: *hadoop-env
    volumes:
      - hdfs-data:/data       # the file blocks survive a recreate (needs hdfs-name too: same cluster ID)
    depends_on:
      - namenode

  # Kafka: the message queue between the producer (Part 4) and Spark.
  # One broker in KRaft mode: Kafka manages its own metadata, so no ZooKeeper.
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    restart: unless-stopped   # if it ever crashes, Docker starts it again (topics are on the volume)
    environment:
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m               # memory cap (default 1 GB)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller           # this one node does both jobs
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Three listeners (ports Kafka listens on):
      #   INTERNAL   kafka:9092      for other containers (producer, Spark, Kafka UI)
      #   EXTERNAL   localhost:9094  for tools on your laptop
      #   CONTROLLER :9093           Kafka's internal metadata traffic
      # "Advertised" is the address Kafka gives clients to connect back to,
      # so each one has to be reachable from where that client is running.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Only one broker, so Kafka's own internal topics can keep just one copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are only created by scripts/create_topics.sh, so a typo in a
      # topic name gives an error instead of silently creating a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data              # retention stays at the default 7 days
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data                 # topics survive "docker compose down"

  # Kafka UI: web page for browsing topics, partitions and messages: http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092    # internal listener: it runs in Docker
      JAVA_OPTS: -Xmx192m                              # memory cap
    ports:
      - "8080:8080"
    depends_on:
      - kafka

  # Producer: replays the matches from HDFS into Kafka (code in producer/).
  # The "producer" profile keeps "docker compose up -d" from starting it;
  # run it when you want a replay:
  #   docker compose run --rm producer --speed 30
  producer:
    build: ./producer
    profiles: ["producer"]
    depends_on:
      - namenode
      - datanode
      - kafka

  # Spark in standalone mode: one master that hands out work, one worker that does it.
  # Spark 3.5 (Scala 2.12): the Kafka and MongoDB connectors are added later with
  # --packages and their versions must match this.
  spark-master:
    image: apache/spark:3.5.3
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_DAEMON_MEMORY: 256m   # the master process itself (default 1 GB)
    ports:
      - "8081:8080"   # master web UI: http://localhost:8081 (8080 is Kafka UI)
    volumes:
      # our job code; spark-submit runs here (scripts/run_spark_job.sh)
      - ./spark:/opt/spark-apps:ro

  spark-worker:
    image: apache/spark:3.5.3
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077"]                 # register with the master
    environment:
      SPARK_WORKER_CORES: 2       # run at most 2 tasks at the same time
      SPARK_WORKER_MEMORY: 1g     # memory the worker can give to jobs (executors)
      SPARK_DAEMON_MEMORY: 256m   # the worker process itself (default 1 GB)
    ports:
      - "8082:8081"   # worker web UI: http://localhost:8082
    depends_on:
      - spark-master

  # MongoDB: stores Spark's window stats for the dashboard.
  # Runs as a replica set with one member ("rs0"): only replica sets have an
  # oplog, and the dashboard's Change Streams read it to get changes pushed live.
  mongodb:
    image: mongo:7.0
    hostname: mongodb
    command: ["--replSet", "rs0", "--bind_ip_all",
              "--wiredTigerCacheSizeGB", "0.25"]           # memory cap for the data cache (default ~50% of RAM)
    ports:
      - "27018:27017" # for mongosh / Compass on your Mac: mongodb://localhost:27018/?directConnection=true (27017 is taken by Homebrew mongod)
    volumes:
      - mongo-data:/data/db
    # The replica set has to be set up once ("rs.initiate"). The healthcheck does
    # it on the first start, and after that reports healthy once this node is PRIMARY.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval",
             "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Live dashboard (code in dashboard/): Express serves the React page and pushes
  # MongoDB's Change Stream to the browser over a WebSocket.
  # Open http://localhost:3000
  dashboard:
    build: ./dashboard
    environment:
      # Inside Docker: the replica set's own address works, no directConnection needed.
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0
    ports:
      - "3000:3000"
    mem_limit: 192m        # memory cap for the whole container
    restart: unless-stopped # if MongoDB restarts, the Change Stream breaks and the server exits; this brings it back
    depends_on:
      mongodb:
        condition: service_healthy # wait until the replica set has a PRIMARY

volumes:
  kafka-data:
  mongo-data:
  hdfs-name:
  hdfs-data:
